name: Revisar integridad editorial
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Validar páginas, enlaces y anuncios
        run: python3 scripts/auditar_sitio.py
      - name: Validar sintaxis de calculadoras
        run: node --check assets/js/tools.js
