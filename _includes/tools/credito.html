<section class="tool" data-tool="credito" aria-labelledby="t-cre">
  <header class="tool-h"><p class="tool-tag">Calculadora</p><h2 id="t-cre" class="tool-title">¿Cuánto crédito estás usando?</h2><p>Estima el porcentaje de tus límites utilizado y simula pagos; no predice tu puntaje FICO.</p></header>
  <div class="uc-rows"></div>
  <button type="button" class="btn-ghost uc-add">+ Añadir tarjeta</button>
  <div class="uc-meter" aria-hidden="true"><div class="uc-fill"></div><i style="left:10%"></i><i style="left:30%"></i><i style="left:50%"></i></div>
  <div class="uc-scale" aria-hidden="true"><span>0 %</span><span style="left:10%">10 %</span><span style="left:30%">30 %</span><span style="left:50%">50 %</span></div>
  <p class="uc-big"><b data-out="pct">—</b> <span class="lvl" data-out="nivel"></span></p>
  <p class="tool-result" data-out="consejo" aria-live="polite"></p>
</section>
