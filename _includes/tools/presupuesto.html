<section class="tool" data-tool="presupuesto" aria-labelledby="t-pre">
  <header class="tool-h"><p class="tool-tag">Calculadora</p><h2 id="t-pre" class="tool-title">Tu presupuesto 50/30/20 en segundos</h2><p>Escribe lo que recibes al mes después de impuestos y mira cómo repartirlo.</p></header>
  <div class="tool-grid">
    <label>Ingreso neto mensual (USD)<input name="ingreso" inputmode="decimal" value="3200"></label>
    <label>Tu renta mensual (USD)<input name="renta" inputmode="decimal" value="1300"></label>
    <label class="check"><input type="checkbox" name="familia"> Envío dinero a mi familia</label>
  </div>
  <div class="bp-bar" aria-hidden="true"></div>
  <ul class="bp-list"></ul>
  <p class="tool-result" aria-live="polite"><span data-out="tip"></span> Siguiendo el plan ahorrarías <b data-out="ahorro_anual">—</b> al año.</p>
</section>
